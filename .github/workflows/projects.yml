name: Projects

# Runs each portfolio project's offline test suite and eval runner, so the
# per-project test counts recorded in LAST_VERIFIED.md stay true.

on:
  push:
    branches: [main]
    paths: ["projects/**", ".github/workflows/projects.yml"]
  pull_request:
    branches: [main]
    paths: ["projects/**", ".github/workflows/projects.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: discover projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          projects=$(find projects -mindepth 2 -maxdepth 2 -name pyproject.toml \
            -exec dirname {} \; | xargs -n1 basename | sort | jq -R . | jq -sc .)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.project }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    env:
      # Projects whose eval runner calls a live provider API and needs a key.
      LIVE_EVAL_PROJECTS: "01-structured-output-extractor"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/${{ matrix.project }}/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -v
      - name: Eval
        run: |
          if [[ " $LIVE_EVAL_PROJECTS " == *" ${{ matrix.project }} "* ]]; then
            echo "Skipping: eval needs a live API key."
          else
            python evals/eval_runner.py
          fi
